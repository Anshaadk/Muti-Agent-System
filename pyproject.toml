[project]
name = "mutiagentsystem"
version = "0.1.0"
description = "Multi-agent AI system using LangChain and LLMs"
readme = "README.md"
authors = [
    { name = "Anshaadk", email = "muhammedanshadmdi5@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-openai>=0.1.0",
    "openai>=1.30.0",
    "tavily-python>=0.3.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "lxml>=5.0.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
    "pandas>=2.0.0",
    "tiktoken>=0.6.0",
    "rich>=13.7.0",
    "tenacity>=8.2.0",
    "orjson>=3.9.0",
    "pydantic>=2.5.0",
    "html5lib>=1.1",
    "langchain-groq>=1.1.3",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "chromadb>=1.5.9",
]

[project.scripts]
mutiagentsystem = "mutiagentsystem:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
